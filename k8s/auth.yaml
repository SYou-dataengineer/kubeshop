apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshop-auth
  labels:
    app: kubeshop-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeshop-auth
  template:
    metadata:
      labels:
        app: kubeshop-auth
    spec:
      containers:
        - name: auth
          image: kubeshop-auth:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubeshop-auth
  labels:
    app: kubeshop-auth
spec:
  type: ClusterIP
  selector:
    app: kubeshop-auth
  ports:
    - name: http
      port: 3001
      targetPort: 3001