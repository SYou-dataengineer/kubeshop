apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: kubeshop
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /login {
            proxy_pass http://auth-service:3001/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /payments {
            proxy_pass http://payment-service:3002/payments;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "KubeShop frontend is healthy\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kubeshop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kubeshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeshop-frontend
  template:
    metadata:
      labels:
        app: kubeshop-frontend
    spec:
      containers:
        - name: frontend
          image: kubeshop-frontend:k8s-v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kubeshop
spec:
  type: ClusterIP
  selector:
    app: kubeshop-frontend
  ports:
    - name: http
      port: 80
      targetPort: http