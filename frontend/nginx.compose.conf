server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /login {
        proxy_pass http://auth-service:3001/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /payments {
        proxy_pass http://payment-service:3002/payments;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /events/clicks {
        proxy_pass http://event-service:3003/events/clicks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /events/cart {
        proxy_pass http://event-service:3003/events/cart;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "KubeShop frontend is healthy\n";
    }
}