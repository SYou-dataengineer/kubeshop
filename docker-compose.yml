name: kubeshop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kubeshop}
      POSTGRES_USER: ${POSTGRES_USER:-kubeshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubeshop_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: "3600"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  payment-service:
    build:
      context: ./payment-service
    environment:
      PORT: "3002"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-kubeshop}
      PGUSER: ${POSTGRES_USER:-kubeshop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kubeshop_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
  redis-data: